<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- 引入 Font Awesome 6 -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<!-- 引入 Outfit 与 华文黑体 等现代字体 -->

			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
		<script>
			// 防闪白核心脚本：挂载前快速检测 localStorage 的主题偏好并写入 html class
			try {
				const store = JSON.parse(localStorage.getItem('_user'))
				if (store && store.theme === 'dark') {
					document.documentElement.classList.add('dark')
				}
			} catch (e) {}
		</script>
