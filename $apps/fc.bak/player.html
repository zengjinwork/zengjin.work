<!doctype html>
<html lang="zh">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>FC | zengjin.work</title>
		<style>
			html,
			body,
			.player {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
		</style>
	</head>
	<body>
		<div class="player"></div>
		<script>
			let optionsString = decodeURIComponent(Object.fromEntries(new URLSearchParams(location.search)).options || '{}')
			let options = JSON.parse(optionsString)

			Object.assign(window, options, {
				EJS_player: '.player',
				EJS_pathtodata: 'https://cdn.zengjin.work/plugin/EmulatorJS/data/',
			})
		</script>
		<script src="https://cdn.zengjin.work/plugin/EmulatorJS/data/loader.js"></script>
	</body>
</html>
